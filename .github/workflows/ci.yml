name: verify

# 四道门禁的顺序是刻意的：typecheck → test → 行数预算。
# 行数门禁放最后，是为了让「类型错」和「测试红」这两种真问题先暴露，
# 而不是被一句「超预算」提前打断。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: typecheck / test / lines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (lockfile must be committed)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Line budget gate (core+server+web <= 15000)
        run: npm run lines
